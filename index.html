<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>우리 반 데이터 탐색</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<main class="wrap">
  <div class="madeby">made by ChoiWooo</div>
  <header>
    <h1>우리 반 친구들은 어떻게 모일까?</h1>
    <p>생활 속 숫자를 입력하면 비슷한 특징을 가진 친구들을 자동으로 찾아줍니다.</p>
  </header>

  <section class="card">
    <div class="top">
      <div>
        <h2>1. 데이터 넣기</h2>
        <p>직접 고치거나 같은 형식의 CSV·Excel 파일을 올릴 수 있어요.</p>
      </div>
      <div class="actions">
        <input id="fileInput" type="file" accept=".csv,.xlsx,.xls">
        <button id="resetBtn" class="sub">예시 데이터</button>
        <button id="runBtn">분석하기</button>
      </div>
    </div>
    <div id="message" class="message"></div>
    <div class="tableBox">
      <table id="dataTable"><thead></thead><tbody></tbody></table>
    </div>
  </section>

  <section id="results" class="hidden">
    <section class="card">
      <div class="top">
        <div>
          <h2>2. 가장 잘 나뉘는 그룹</h2>
          <p>여러 가지 그룹 수를 비교해서 가장 잘 나뉘는 경우를 자동으로 골랐어요.</p>
        </div>
        <div id="bestGroup" class="best"></div>
      </div>
      <div class="chartSmall"><canvas id="scoreChart"></canvas></div>
    </section>

    <section class="card">
      <div class="top">
        <div>
          <h2>3. 친구들이 어떻게 나뉘었을까?</h2>
          <p>같은 색의 점은 비슷한 특징을 가진 친구들이에요.</p>
        </div>
        <div id="groupCounts" class="badges"></div>
      </div>
      <div class="chartBig"><canvas id="clusterChart"></canvas></div>
    </section>

    <section class="card">
      <h2>4. 학생별 그룹</h2>
      <div class="tableBox compact">
        <table id="resultTable">
          <thead><tr><th>학생</th><th>그룹</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>5. 각 그룹의 평균 특징</h2>
      <div class="tableBox compact"><table id="meanTable"></table></div>
    </section>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
